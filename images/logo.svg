<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Light World Electricals</title>
  <defs>
    <!-- badge -->
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c323b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="badgeEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <!-- white light halo -->
    <radialGradient id="halo" cx="128" cy="104" r="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#e6efff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e6efff" stop-opacity="0"/>
    </radialGradient>
    <!-- frosted glass, lit from inside -->
    <radialGradient id="glass" cx="120" cy="96" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#dfeaff" stop-opacity=".16"/>
      <stop offset=".85" stop-color="#cddcf5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="core" cx="128" cy="100" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- chrome base -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c6470"/>
      <stop offset=".18" stop-color="#c9d0d8"/>
      <stop offset=".34" stop-color="#f7f9fb"/>
      <stop offset=".52" stop-color="#9aa3ae"/>
      <stop offset=".72" stop-color="#e6eaef"/>
      <stop offset="1" stop-color="#4b525c"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d97a3"/>
      <stop offset=".35" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#c3cad3"/>
      <stop offset="1" stop-color="#6c7480"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15181c"/>
      <stop offset=".4" stop-color="#3a414a"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="wide"/>
      <feGaussianBlur stdDeviation="1.6" result="near"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="wide"/><feMergeNode in="near"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globeClip"><circle cx="128" cy="104" r="56"/></clipPath>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#badge)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="57.25" fill="none" stroke="url(#badgeEdge)" stroke-width="1.5"/>

  <!-- halo + rays -->
  <circle cx="128" cy="104" r="104" fill="url(#halo)"/>
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="4.4" opacity=".9" filter="url(#bloom)">
    <line x1="128" y1="24" x2="128" y2="34"/>
    <line x1="72" y1="47" x2="79" y2="54"/>
    <line x1="184" y1="47" x2="177" y2="54"/>
    <line x1="48" y1="104" x2="58" y2="104"/>
    <line x1="208" y1="104" x2="198" y2="104"/>
  </g>

  <g filter="url(#drop)">
    <!-- glass -->
    <path d="M128 46a58 58 0 0 1 41 99c-6.5 6.5-10 13.5-11 22H98c-1-8.5-4.5-15.5-11-22A58 58 0 0 1 128 46z" fill="url(#glass)"/>
    <circle cx="128" cy="104" r="46" fill="url(#core)" opacity=".45" filter="url(#soft)"/>

    <!-- the world, drawn in white light -->
    <g clip-path="url(#globeClip)" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" filter="url(#bloom)">
      <circle cx="128" cy="104" r="40"/>
      <ellipse cx="128" cy="104" rx="16" ry="40"/>
      <line x1="88" y1="104" x2="168" y2="104"/>
      <path d="M93 85q35 9 70 0"/>
      <path d="M93 123q35-9 70 0"/>
    </g>

    <!-- glass rim and highlights -->
    <path d="M128 46a58 58 0 0 1 41 99c-6.5 6.5-10 13.5-11 22H98c-1-8.5-4.5-15.5-11-22A58 58 0 0 1 128 46z" fill="none" stroke="url(#rim)" stroke-width="2.2"/>
    <path d="M84 96a46 46 0 0 1 26-42" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".85"/>
    <circle cx="82" cy="110" r="3.2" fill="#ffffff" opacity=".8"/>
    <path d="M176 118a50 50 0 0 1-14 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".35"/>

    <!-- collar -->
    <rect x="96" y="163" width="64" height="9" rx="3" fill="url(#collar)"/>
    <!-- chrome screw base -->
    <rect x="99" y="171" width="58" height="36" rx="6" fill="url(#chrome)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M100 180l56 -3" stroke="#3d444d" stroke-opacity=".55" stroke-width="3"/>
      <path d="M100 183l56 -3" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.6"/>
      <path d="M100 191l56 -3" stroke="#3d444d" stroke-opacity=".55" stroke-width="3"/>
      <path d="M100 194l56 -3" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.6"/>
      <path d="M100 202l56 -3" stroke="#3d444d" stroke-opacity=".5" stroke-width="3"/>
    </g>
    <!-- contact tip -->
    <path d="M108 207h40l-7 14a6 6 0 0 1-5.4 3.4h-15.2a6 6 0 0 1-5.4-3.4z" fill="url(#tip)"/>
    <path d="M118 220h20" stroke="#ffffff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
