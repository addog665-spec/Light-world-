<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Light World Electricals</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset=".55" stop-color="#1656d6"/>
      <stop offset="1" stop-color="#0a2f86"/>
    </linearGradient>
    <!-- white light behind the bulb -->
    <radialGradient id="halo" cx="128" cy="100" r="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- lit glass: bright white, shaded towards the edge for depth -->
    <radialGradient id="glass" cx="110" cy="80" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".78" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#b7cbf0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c7fa3"/>
      <stop offset=".2" stop-color="#d9e3f5"/>
      <stop offset=".38" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#a6b6d3"/>
      <stop offset=".78" stop-color="#e8eefa"/>
      <stop offset="1" stop-color="#55688c"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f93ba"/>
      <stop offset=".35" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#c2d0ea"/>
      <stop offset="1" stop-color="#62779f"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d2a6b"/>
      <stop offset=".45" stop-color="#2d58b5"/>
      <stop offset="1" stop-color="#0a2259"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="badgeClip"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
    <clipPath id="globeClip"><circle cx="128" cy="100" r="53"/></clipPath>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#badge)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5"/>
  <circle cx="128" cy="100" r="112" fill="url(#halo)" clip-path="url(#badgeClip)"/>

  <g filter="url(#drop)">
    <!-- glass -->
    <path d="M128 34a66 66 0 0 1 46.7 112.7c-7 7-11 14-12 23.3H93.3c-1-9.3-5-16.3-12-23.3A66 66 0 0 1 128 34z" fill="url(#glass)"/>

    <!-- the world -->
    <g clip-path="url(#globeClip)" fill="none" stroke="#1450c8" stroke-width="5" stroke-linecap="round">
      <ellipse cx="128" cy="100" rx="21" ry="50"/>
      <line x1="76" y1="100" x2="180" y2="100"/>
      <path d="M83 74q45 12 90 0"/>
      <path d="M83 126q45-12 90 0"/>
    </g>
    <circle cx="128" cy="100" r="50" fill="none" stroke="#1450c8" stroke-width="5"/>

    <!-- crisp rim -->
    <path d="M128 34a66 66 0 0 1 46.7 112.7c-7 7-11 14-12 23.3H93.3c-1-9.3-5-16.3-12-23.3A66 66 0 0 1 128 34z" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- collar -->
    <rect x="90" y="167" width="76" height="11" rx="4" fill="url(#collar)"/>
    <!-- chrome screw base -->
    <rect x="95" y="177" width="66" height="38" rx="7" fill="url(#chrome)"/>
    <path d="M96 190l64-4M96 203l64-4" fill="none" stroke="#2b3f66" stroke-width="4.5" stroke-linecap="round" stroke-opacity=".7"/>
    <!-- contact tip -->
    <path d="M106 215h44l-8 15a7 7 0 0 1-6.2 3.7h-15.6a7 7 0 0 1-6.2-3.7z" fill="url(#tip)"/>
  </g>
</svg>
