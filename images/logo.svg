<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- light rays -->
  <g stroke="#f5b301" stroke-width="3.2" stroke-linecap="round">
    <line x1="32" y1="1.8" x2="32" y2="5.5"/>
    <line x1="11.2" y1="9.8" x2="13.9" y2="12.5"/>
    <line x1="52.8" y1="9.8" x2="50.1" y2="12.5"/>
    <line x1="2.5" y1="28" x2="6.2" y2="28"/>
    <line x1="61.5" y1="28" x2="57.8" y2="28"/>
  </g>
  <!-- neck -->
  <path d="M24 40 L26 47 H38 L40 40 Z" fill="#f5b301" stroke="#14213d" stroke-width="2" stroke-linejoin="round"/>
  <!-- glass = globe -->
  <circle cx="32" cy="28" r="18" fill="#f5b301" stroke="#14213d" stroke-width="2.4"/>
  <g fill="none" stroke="#14213d" stroke-width="1.8" stroke-linecap="round">
    <ellipse cx="32" cy="28" rx="7.5" ry="18"/>
    <line x1="14" y1="28" x2="50" y2="28"/>
    <path d="M17.2 19 Q32 22 46.8 19"/>
    <path d="M17.2 37 Q32 34 46.8 37"/>
  </g>
  <!-- shine -->
  <path d="M21 19 A13 13 0 0 1 28 13.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
  <!-- screw base -->
  <rect x="25" y="47" width="14" height="10" rx="2" fill="#14213d"/>
  <g stroke="#f5b301" stroke-width="1.4" stroke-linecap="round" opacity=".9">
    <line x1="27" y1="50.3" x2="37" y2="50.3"/>
    <line x1="27" y1="53.7" x2="37" y2="53.7"/>
  </g>
  <path d="M28.5 57 H35.5 L34 61 H30 Z" fill="#14213d"/>
</svg>
