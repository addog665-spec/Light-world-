<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Light World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
  <header id="site-header"></header>

  <main class="section">
    <div class="container">
      <h1>Shop</h1>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search products…" aria-label="Search products">
        <select id="sort" aria-label="Sort products">
          <option value="default">Sort: Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <div class="chips" id="cat-filters"></div>
      <p class="muted" id="result-count"></p>
      <div class="grid" id="product-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
