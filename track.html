<body data-page="track">
  <header id="site-header"></header>

  <section class="page-hero">
    <img src="images/stock/page-delivery.jpg" alt="">
    <div class="container">
      <nav class="crumbs"><a href="index.html">Home</a> › Track order</nav>
      <h1>Track your order</h1>
      <p>Enter the order number from your invoice or WhatsApp message (it looks like LW-261110-NCZ3).</p>
    </div>
  </section>
  <main id="main">
    <section class="section">
      <div class="container track-layout">
        <form id="track-form" class="checkout track-form">
          <label>Order number
            <input name="ref" required placeholder="e.g. LW-261110-NCZ3" autocomplete="off" autocapitalize="characters"></label>
          <button class="btn btn-lg btn-block" type="submit"><span data-icon="search"></span> Track order</button>
          <p class="hint">Want to see how it works? Try a demo order:
            <button type="button" class="link-btn" data-demo-order="LW-DEMO-1001">LW-DEMO-1001</button> or
            <button type="button" class="link-btn" data-demo-order="LW-DEMO-1002">LW-DEMO-1002</button></p>
        </form>
        <div id="track-result" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/app.js"></script>
  <script src="js/features.js"></script>
</body>
